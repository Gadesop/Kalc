name: Build KALC 5.0

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/kuro/calculator
          mkdir -p app/src/main/res/drawable

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "KALC"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          EOF

          echo "android.useAndroidX=true" > gradle.properties

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.kuro.calculator"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.kuro.calculator"
                  minSdk = 23
                  targetSdk = 35
                  versionCode = 5
                  versionName = "5.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.12.01"))
              implementation("androidx.activity:activity-compose:1.9.3")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.foundation:foundation")
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="KALC"
                  android:allowBackup="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_pattern.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="400dp"
              android:height="800dp"
              android:viewportWidth="400"
              android:viewportHeight="800">
              <path
                  android:fillColor="#B185F5"
                  android:pathData="M0,0h400v800H0z"/>
              <path
                  android:fillColor="#D8BEFF"
                  android:pathData="M0,0c100,50 150,150 100,250s-100,100 -50,200 150,150 100,350H0V0z"/>
              <path
                  android:fillColor="#9C6CE8"
                  android:pathData="M400,0c-80,100 -120,200 -70,350s120,150 70,300V0z"/>
              <path
                  android:fillColor="#C4A1FF"
                  android:pathData="M150,0c50,100 -50,250 50,400s150,200 100,400H50V0h100z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/java/com/kuro/calculator/MainActivity.kt
          package com.kuro.calculator

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.Image
          import androidx.compose.foundation.background
          import androidx.compose.foundation.border
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.alpha
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Brush
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.layout.ContentScale
          import androidx.compose.ui.res.painterResource
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.TextOverflow
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import java.util.Locale

          private val BgBase = Color(0xFF0A0712)
          private val NeonViolet = Color(0xFFD4BBFF)
          private val TextMain = Color(0xFFFFFFFF)
          private val TextMuted = Color(0xFF9E92B3)

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.statusBarColor = android.graphics.Color.rgb(10, 7, 18)
                  window.navigationBarColor = android.graphics.Color.rgb(10, 7, 18)
                  setContent { KalcApp() }
              }
          }

          @Composable
          fun KalcApp() {
              var display by remember { mutableStateOf("0") }
              var stored by remember { mutableStateOf<Double?>(null) }
              var operator by remember { mutableStateOf("") }
              var fresh by remember { mutableStateOf(false) }
              var expression by remember { mutableStateOf("") }
              var history by remember { mutableStateOf(listOf<String>()) }
              var showHistory by remember { mutableStateOf(false) }

              fun computeResult(a: Double, b: Double, op: String): Double? {
                  return when (op) {
                      "+" -> a + b
                      "−" -> a - b
                      "×" -> a * b
                      "÷" -> if (b != 0.0) a / b else null
                      else -> null
                  }
              }

              fun press(key: String) {
                  when (key) {
                      "AC" -> {
                          display = "0"
                          stored = null
                          operator = ""
                          expression = ""
                          fresh = false
                      }
                      "DEL" -> {
                          if (!fresh) {
                              display = if (display.length > 1) display.dropLast(1) else "0"
                          }
                      }
                      "+", "−", "×", "÷" -> {
                          val currentVal = display.toDoubleOrNull()
                          if (stored != null && operator.isNotEmpty() && !fresh && currentVal != null) {
                              val prevResult = computeResult(stored!!, currentVal, operator)
                              if (prevResult != null) {
                                  display = format(prevResult)
                                  stored = prevResult
                              } else {
                                  display = "Error"
                                  stored = null
                              }
                          } else {
                              stored = currentVal
                          }
                          operator = key
                          expression = "$display $key"
                          fresh = true
                      }
                      "=" -> {
                          val a = stored
                          val b = display.toDoubleOrNull()
                          if (a != null && b != null && operator.isNotEmpty()) {
                              val result = computeResult(a, b, operator)
                              val old = "$expression $display"
                              display = result?.let { format(it) } ?: "Error"
                              if (result != null) {
                                  history = listOf("$old = $display") + history.take(19)
                              }
                              expression = old
                              stored = null
                              operator = ""
                              fresh = true
                          }
                      }
                      "%" -> display = format((display.toDoubleOrNull() ?: 0.0) / 100)
                      "±" -> display = format(-(display.toDoubleOrNull() ?: 0.0))
                      "." -> {
                          if (fresh) {
                              display = "0."
                              fresh = false
                          } else if (!display.contains(".")) {
                              display += "."
                          }
                      }
                      else -> {
                          if (fresh || display == "0" || display == "Error") {
                              display = key
                              fresh = false
                          } else if (display.length < 15) {
                              display += key
                          }
                      }
                  }
              }

              val rows = listOf(
                  listOf("AC", "±", "%", "÷"),
                  listOf("7", "8", "9", "×"),
                  listOf("4", "5", "6", "−"),
                  listOf("1", "2", "3", "+")
              )

              Box(
                  modifier = Modifier
                      .fillMaxSize()
                      .background(BgBase)
              ) {
                  Image(
                      painter = painterResource(id = R.drawable.bg_pattern),
                      contentDescription = null,
                      modifier = Modifier
                          .fillMaxSize()
                          .alpha(0.25f),
                      contentScale = ContentScale.Crop
                  )

                  Column(
                      modifier = Modifier
                          .fillMaxSize()
                          .statusBarsPadding()
                          .navigationBarsPadding()
                          .padding(horizontal = 20.dp, vertical = 12.dp)
                  ) {
                      Row(
                          modifier = Modifier
                              .fillMaxWidth()
                              .padding(bottom = 12.dp),
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          Box(
                              Modifier
                                  .size(40.dp)
                                  .clip(RoundedCornerShape(12.dp))
                                  .background(
                                      Brush.linearGradient(
                                          listOf(Color(0xFFD4BBFF), Color(0xFF7A45FF))
                                      )
                                  ),
                              contentAlignment = Alignment.Center
                          ) {
                              Text(
                                  "K",
                                  color = Color.Black,
                                  fontSize = 22.sp,
                                  fontWeight = FontWeight.Black
                              )
                          }

                          Spacer(Modifier.width(12.dp))

                          Column {
                              Text(
                                  "KALC",
                                  color = TextMain,
                                  fontSize = 18.sp,
                                  fontWeight = FontWeight.Bold,
                                  letterSpacing = 2.5.sp
                              )
                              Text(
                                  "LIQUID GLASS V5",
                                  color = TextMuted,
                                  fontSize = 8.sp,
                                  letterSpacing = 1.5.sp
                              )
                          }

                          Spacer(Modifier.weight(1f))

                          GlassButton(
                              onClick = { showHistory = !showHistory },
                              modifier = Modifier.height(38.dp)
                          ) {
                              Text(
                                  if (showHistory) "CALC" else "HISTORY",
                                  color = NeonViolet,
                                  fontSize = 11.sp,
                                  fontWeight = FontWeight.Bold,
                                  modifier = Modifier.padding(horizontal = 14.dp)
                              )
                          }
                      }

                      if (showHistory) {
                          Text(
                              "Calculation History",
                              color = TextMain,
                              fontSize = 22.sp,
                              fontWeight = FontWeight.SemiBold,
                              modifier = Modifier.padding(vertical = 16.dp)
                          )
                          if (history.isEmpty()) {
                              Box(
                                  modifier = Modifier
                                      .weight(1f)
                                      .fillMaxWidth(),
                                  contentAlignment = Alignment.Center
                              ) {
                                  Text("No calculations recorded yet.", color = TextMuted)
                              }
                          } else {
                              LazyColumn(
                                  modifier = Modifier.weight(1f),
                                  verticalArrangement = Arrangement.spacedBy(8.dp)
                              ) {
                                  items(history) { item ->
                                      GlassPanel(modifier = Modifier.fillMaxWidth()) {
                                          Text(
                                              item,
                                              color = TextMain,
                                              fontSize = 15.sp,
                                              modifier = Modifier.padding(16.dp)
                                          )
                                      }
                                  }
                              }
                              TextButton(
                                  onClick = { history = emptyList() },
                                  modifier = Modifier
                                      .fillMaxWidth()
                                      .padding(vertical = 12.dp)
                              ) {
                                  Text("CLEAR HISTORY", color = NeonViolet, fontSize = 12.sp, fontWeight = FontWeight.Bold)
                              }
                          }
                      } else {
                          GlassPanel(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .weight(0.38f)
                          ) {
                              Column(
                                  modifier = Modifier
                                      .fillMaxSize()
                                      .padding(20.dp),
                                  verticalArrangement = Arrangement.Bottom,
                                  horizontalAlignment = Alignment.End
                              ) {
                                  Text(
                                      expression.ifEmpty { " " },
                                      color = TextMuted,
                                      fontSize = 16.sp,
                                      maxLines = 1,
                                      overflow = TextOverflow.Ellipsis
                                  )
                                  Spacer(Modifier.height(8.dp))
                                  Text(
                                      display,
                                      color = TextMain,
                                      fontSize = if (display.length > 9) 40.sp else 52.sp,
                                      fontWeight = FontWeight.Light,
                                      maxLines = 1,
                                      overflow = TextOverflow.Ellipsis
                                  )
                              }
                          }

                          Spacer(Modifier.height(16.dp))

                          Column(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .weight(0.62f),
                              verticalArrangement = Arrangement.spacedBy(10.dp)
                          ) {
                              rows.forEach { row ->
                                  Row(
                                      modifier = Modifier
                                          .fillMaxWidth()
                                          .weight(1f),
                                      horizontalArrangement = Arrangement.spacedBy(10.dp)
                                  ) {
                                      row.forEach { key ->
                                          CalculatorKey(
                                              key = key,
                                              modifier = Modifier
                                                  .weight(1f)
                                                  .fillMaxHeight(),
                                              onClick = { press(key) }
                                          )
                                      }
                                  }
                              }

                              Row(
                                  modifier = Modifier
                                      .fillMaxWidth()
                                      .weight(1f),
                                  horizontalArrangement = Arrangement.spacedBy(10.dp)
                              ) {
                                  CalculatorKey("DEL", Modifier.weight(1f).fillMaxHeight()) { press("DEL") }
                                  CalculatorKey("0", Modifier.weight(1f).fillMaxHeight()) { press("0") }
                                  CalculatorKey(".", Modifier.weight(1f).fillMaxHeight()) { press(".") }
                                  CalculatorKey("=", Modifier.weight(1f).fillMaxHeight()) { press("=") }
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun GlassPanel(
              modifier: Modifier = Modifier,
              content: @Composable BoxScope.() -> Unit
          ) {
              Box(
                  modifier = modifier
                      .clip(RoundedCornerShape(24.dp))
                      .background(
                          Brush.linearGradient(
                              listOf(
                                  Color(0x22FFFFFF),
                                  Color(0x0AFFFFFF)
                              )
                          )
                      )
                      .border(
                          width = 1.dp,
                          brush = Brush.linearGradient(
                              listOf(
                                  Color(0x55FFFFFF),
                                  Color(0x10FFFFFF)
                              )
                          ),
                          shape = RoundedCornerShape(24.dp)
                      ),
                  content = content
              )
          }

          @Composable
          fun GlassButton(
              modifier: Modifier = Modifier,
              onClick: () -> Unit,
              content: @Composable BoxScope.() -> Unit
          ) {
              Box(
                  modifier = modifier
                      .clip(RoundedCornerShape(14.dp))
                      .background(Color(0x18FFFFFF))
                      .border(1.dp, Color(0x33FFFFFF), RoundedCornerShape(14.dp))
                      .clickable { onClick() },
                  contentAlignment = Alignment.Center,
                  content = content
              )
          }

          @Composable
          fun CalculatorKey(
              key: String,
              modifier: Modifier = Modifier,
              onClick: () -> Unit
          ) {
              val isEqual = key == "="
              val isOperator = key in listOf("+", "−", "×", "÷")
              val isUtility = key in listOf("AC", "±", "%", "DEL")

              val bgBrush = when {
                  isEqual -> Brush.linearGradient(listOf(Color(0xFFD4BBFF), Color(0xFF9165FF)))
                  isOperator -> Brush.linearGradient(listOf(Color(0x449165FF), Color(0x22352266)))
                  isUtility -> Brush.linearGradient(listOf(Color(0x26FFFFFF), Color(0x0DFFFFFF)))
                  else -> Brush.linearGradient(listOf(Color(0x18FFFFFF), Color(0x0AFFFFFF)))
              }

              val textColor = when {
                  isEqual -> Color(0xFF0C071C)
                  isOperator -> NeonViolet
                  isUtility -> Color(0xFFE2D8FF)
                  else -> TextMain
              }

              Box(
                  modifier = modifier
                      .clip(RoundedCornerShape(20.dp))
                      .background(bgBrush)
                      .border(
                          width = 1.dp,
                          brush = Brush.verticalGradient(
                              listOf(Color(0x44FFFFFF), Color(0x11FFFFFF))
                          ),
                          shape = RoundedCornerShape(20.dp)
                      )
                      .clickable { onClick() },
                  contentAlignment = Alignment.Center
              ) {
                  Text(
                      text = if (key == "DEL") "⌫" else key,
                      color = textColor,
                      fontSize = if (key.length > 1) 16.sp else 22.sp,
                      fontWeight = if (isEqual || isOperator) FontWeight.Bold else FontWeight.Medium
                  )
              }
          }

          fun format(value: Double): String {
              if (!value.isFinite()) return "Error"
              if (value == value.toLong().toDouble()) {
                  return value.toLong().toString()
              }
              return String.format(Locale.US, "%.8f", value)
                  .trimEnd('0')
                  .trimEnd('.')
          }
          EOF

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KALC-5-LIQUID-GLASS
          path: app/build/outputs/apk/debug/app-debug.apk
