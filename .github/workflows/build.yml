
name: Build KALC 4.0

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/kuro/calculator

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "KALC"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          EOF

          echo "android.useAndroidX=true" > gradle.properties

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.kuro.calculator"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.kuro.calculator"
                  minSdk = 23
                  targetSdk = 35
                  versionCode = 4
                  versionName = "4.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.12.01"))
              implementation("androidx.activity:activity-compose:1.9.3")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.foundation:foundation")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="KALC"
                  android:allowBackup="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/kuro/calculator/MainActivity.kt <<'EOF'
          package com.kuro.calculator

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.blur
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Brush
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.TextAlign
          import androidx.compose.ui.text.style.TextOverflow
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import java.util.Locale

          private val Bg = Color(0xFF08070D)
          private val Glass = Color(0x24FFFFFF)
          private val Border = Color(0x35FFFFFF)
          private val Violet = Color(0xFFCCB8FF)
          private val TextMain = Color(0xFFF8F5FF)
          private val TextMuted = Color(0xFF9A91AA)

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.statusBarColor = android.graphics.Color.rgb(8, 7, 13)
                  window.navigationBarColor = android.graphics.Color.rgb(8, 7, 13)
                  setContent { KalcApp() }
              }
          }

          @Composable
          fun KalcApp() {
              var display by remember { mutableStateOf("0") }
              var stored by remember { mutableStateOf<Double?>(null) }
              var operator by remember { mutableStateOf("") }
              var fresh by remember { mutableStateOf(false) }
              var expression by remember { mutableStateOf("") }
              var history by remember { mutableStateOf(listOf<String>()) }
              var showHistory by remember { mutableStateOf(false) }

              fun press(key: String) {
                  when (key) {
                      "AC" -> {
                          display = "0"
                          stored = null
                          operator = ""
                          expression = ""
                          fresh = false
                      }
                      "DEL" -> {
                          if (!fresh) {
                              display = if (display.length > 1)
                                  display.dropLast(1) else "0"
                          }
                      }
                      "+", "−", "×", "÷" -> {
                          stored = display.toDoubleOrNull()
                          operator = key
                          expression = "$display $key"
                          fresh = true
                      }
                      "=" -> {
                          val a = stored
                          val b = display.toDoubleOrNull()
                          if (a != null && b != null) {
                              val result = when (operator) {
                                  "+" -> a + b
                                  "−" -> a - b
                                  "×" -> a * b
                                  "÷" -> if (b != 0.0) a / b else null
                                  else -> null
                              }
                              val old = "$expression $display"
                              display = result?.let { format(it) } ?: "Error"
                              if (result != null) {
                                  history = listOf("$old = $display") +
                                      history.take(19)
                              }
                              expression = old
                              stored = null
                              operator = ""
                              fresh = true
                          }
                      }
                      "%" -> display = format(
                          (display.toDoubleOrNull() ?: 0.0) / 100
                      )
                      "±" -> display = format(
                          -(display.toDoubleOrNull() ?: 0.0)
                      )
                      "." -> {
                          if (fresh) {
                              display = "0."
                              fresh = false
                          } else if (!display.contains(".")) {
                              display += "."
                          }
                      }
                      else -> {
                          if (fresh || display == "0" || display == "Error") {
                              display = key
                              fresh = false
                          } else if (display.length < 15) {
                              display += key
                          }
                      }
                  }
              }

              val rows = listOf(
                  listOf("AC", "±", "%", "÷"),
                  listOf("7", "8", "9", "×"),
                  listOf("4", "5", "6", "−"),
                  listOf("1", "2", "3", "+")
              )

              BoxWithConstraints(
                  modifier = Modifier
                      .fillMaxSize()
                      .background(Bg)
              ) {
                  val compact = maxHeight < 700.dp

                  Box(Modifier.fillMaxSize()) {
                      Box(
                          Modifier
                              .offset(x = (-95).dp, y = 80.dp)
                              .size(250.dp)
                              .blur(85.dp)
                              .background(
                                  Color(0xFF6844A9),
                                  CircleShape
                              )
                      )
                      Box(
                          Modifier
                              .align(Alignment.BottomEnd)
                              .offset(x = 90.dp, y = (-100).dp)
                              .size(220.dp)
                              .blur(75.dp)
                              .background(
                                  Color(0xFF343C91),
                                  CircleShape
                              )
                      )

                      Column(
                          modifier = Modifier
                              .fillMaxSize()
                              .padding(
                                  horizontal = 19.dp,
                                  vertical = if (compact) 10.dp else 17.dp
                              )
                      ) {
                          Row(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .padding(vertical = 10.dp),
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              Box(
                                  Modifier
                                      .size(43.dp)
                                      .clip(RoundedCornerShape(15.dp))
                                      .background(
                                          Brush.linearGradient(
                                              listOf(
                                                  Color(0xFFBFA6FF),
                                                  Color(0xFF64469D)
                                              )
                                          )
                                      ),
                                  contentAlignment = Alignment.Center
                              ) {
                                  Text(
                                      "K",
                                      color = Color.White,
                                      fontSize = 25.sp,
                                      fontWeight = FontWeight.Bold
                                  )
                              }

                              Spacer(Modifier.width(12.dp))

                              Column {
                                  Text(
                                      "KALC",
                                      color = TextMain,
                                      fontSize = 21.sp,
                                      fontWeight = FontWeight.Bold,
                                      letterSpacing = 3.sp
                                  )
                                  Text(
                                      "LIQUID GLASS",
                                      color = TextMuted,
                                      fontSize = 9.sp,
                                      letterSpacing = 2.sp
                                  )
                              }

                              Spacer(Modifier.weight(1f))

                              GlassPanel(
                                  modifier = Modifier
                                      .clip(CircleShape)
                                      .clickable {
                                          showHistory = !showHistory
                                      }
                                      .padding(
                                          horizontal = 17.dp,
                                          vertical = 12.dp
                                      )
                              ) {
                                  Text(
                                      if (showHistory) "CALCULATOR"
                                      else "HISTORY",
                                      color = Violet,
                                      fontSize = 10.sp,
                                      fontWeight = FontWeight.Bold
                                  )
                              }
                          }

                          if (showHistory) {
                              Text(
                                  "History",
                                  color = TextMain,
                                  fontSize = 27.sp,
                                  fontWeight = FontWeight.SemiBold,
                                  modifier = Modifier.padding(
                                      top = 25.dp,
                                      bottom = 18.dp
                                  )
                              )
                              if (history.isEmpty()) {
                                  Text(
                                      "Your calculations will appear here.",
                                      color = TextMuted
                                  )
                              } else {
                                  LazyColumn(
                                      modifier = Modifier.weight(1f),
                                      verticalArrangement =
                                          Arrangement.spacedBy(10.dp)
                                  ) {
                                      items(history) { item ->
                                          GlassPanel(
                                              modifier = Modifier
                                                  .fillMaxWidth()
                                                  .padding(3.dp)
                                                  .padding(16.dp)
                                          ) {
                                              Text(
                                                  item,
                                                  color = TextMain,
                                                  fontSize = 16.sp
                                              )
                                          }
                                      }
                                  }
                                  Text(
                                      "CLEAR HISTORY",
                                      color = Violet,
                                      modifier = Modifier
                                          .clickable {
                                              history = emptyList()
                                          }
                                          .padding(vertical = 18.dp)
                                  )
                              }
                          } else {
                              Spacer(Modifier.weight(1f))

                              GlassPanel(
                                  modifier = Modifier
                                      .fillMaxWidth()
                                      .padding(2.dp)
                                      .padding(
                                          horizontal = 20.dp,
                                          vertical = 25.dp
                                      )
                              ) {
                                  Column(
                                      modifier = Modifier.fillMaxWidth(),
                                      horizontalAlignment =
                                          Alignment.End
                                  ) {
                                      Text(
                                          expression.ifEmpty { " " },
                                          color = TextMuted,
                                          fontSize = 17.sp,
                                          maxLines = 1,
                                          overflow = TextOverflow.Ellipsis
                                      )
                                      Spacer(Modifier.height(12.dp))
                                      Text(
                                          display,
                                          color = TextMain,
                                          fontSize = if (display.length > 10)
                                              39.sp else 53.sp,
                                          fontWeight = FontWeight.Light,
                                          maxLines = 1
                                      )
                                  }
                              }

                              Spacer(Modifier.height(23.dp))

                              rows.forEach { row ->
                                  Row(
                                      modifier = Modifier.fillMaxWidth(),
                                      horizontalArrangement =
                                          Arrangement.spacedBy(10.dp)
                                  ) {
                                      row.forEach { key ->
                                          GlassKey(
                                              key = key,
                                              modifier = Modifier.weight(1f),
                                              onClick = { press(key) }
                                          )
                                      }
                                  }
                                  Spacer(Modifier.height(10.dp))
                              }

                              Row(
                                  modifier = Modifier.fillMaxWidth(),
                                  horizontalArrangement =
                                      Arrangement.spacedBy(10.dp)
                              ) {
                                  GlassKey(
                                      "DEL",
                                      Modifier.weight(1f)
                                  ) { press("DEL") }
                                  GlassKey(
                                      "0",
                                      Modifier.weight(1f)
                                  ) { press("0") }
                                  GlassKey(
                                      ".",
                                      Modifier.weight(1f)
                                  ) { press(".") }
                                  GlassKey(
                                      "=",
                                      Modifier.weight(1f)
                                  ) { press("=") }
                              }

                              Spacer(Modifier.weight(0.5f))
                          }
                      }
                  }
              }
          }

          @Composable
          fun GlassPanel(
              modifier: Modifier = Modifier,
              content: @Composable ColumnScope.() -> Unit
          ) {
              Column(
                  modifier = modifier
                      .clip(RoundedCornerShape(26.dp))
                      .background(
                          Brush.linearGradient(
                              listOf(
                                  Color(0x32FFFFFF),
                                  Color(0x12B9A0FF),
                                  Color(0x18FFFFFF)
                              )
                          )
                      )
                      .background(Border),
                  content = content
              )
          }

          @Composable
          fun GlassKey(
              key: String,
              modifier: Modifier = Modifier,
              onClick: () -> Unit
          ) {
              val equal = key == "="
              val operator = key in listOf("+", "−", "×", "÷")
              val utility = key in listOf("AC", "±", "%", "DEL")

              val background = when {
                  equal -> Brush.linearGradient(
                      listOf(
                          Color(0xFFE0D0FF),
                          Color(0xFF9E7BEE),
                          Color(0xFF7353B4)
                      )
                  )
                  operator -> Brush.linearGradient(
                      listOf(
                          Color(0x66A987E8),
                          Color(0x334C3B6A)
                      )
                  )
                  utility -> Brush.linearGradient(
                      listOf(
                          Color(0x38FFFFFF),
                          Color(0x16FFFFFF)
                      )
                  )
                  else -> Brush.linearGradient(
                      listOf(
                          Color(0x30FFFFFF),
                          Color(0x12FFFFFF)
                      )
                  )
              }

              val foreground = when {
                  equal -> Color(0xFF21152F)
                  operator -> Violet
                  utility -> Color(0xFFC6BDD8)
                  else -> TextMain
              }

              Box(
                  modifier = modifier
                      .height(67.dp)
                      .clip(RoundedCornerShape(23.dp))
                      .background(background)
                      .clickable { onClick() }
                      .padding(1.dp)
                      .background(
                          Brush.verticalGradient(
                              listOf(
                                  Color(0x20FFFFFF),
                                  Color.Transparent
                              )
                          ),
                          RoundedCornerShape(22.dp)
                      ),
                  contentAlignment = Alignment.Center
              ) {
                  Text(
                      if (key == "DEL") "⌫" else key,
                      color = foreground,
                      fontSize = if (key.length > 1) 17.sp else 24.sp,
                      fontWeight = if (equal)
                          FontWeight.Bold else FontWeight.Medium
                  )
              }
          }

          fun format(value: Double): String {
              if (!value.isFinite()) return "Error"
              if (value == value.toLong().toDouble()) {
                  return value.toLong().toString()
              }
              return String.format(Locale.US, "%.8f", value)
                  .trimEnd('0')
                  .trimEnd('.')
          }
          EOF

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KALC-4-LIQUID-GLASS
          path: app/build/outputs/apk/debug/app-debug.apk
