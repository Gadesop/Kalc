
name: Build KALC

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/kuro/calculator

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "KALC"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          EOF

          echo "android.useAndroidX=true" > gradle.properties

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.kuro.calculator"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.kuro.calculator"
                  minSdk = 23
                  targetSdk = 35
                  versionCode = 2
                  versionName = "2.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.12.01"))
              implementation("androidx.activity:activity-compose:1.9.3")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.foundation:foundation")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="KALC"
                  android:allowBackup="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/kuro/calculator/MainActivity.kt <<'EOF'
          package com.kuro.calculator

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.TextAlign
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import java.util.Locale

          private val Background = Color(0xFF090A0F)
          private val Panel = Color(0xFF171820)
          private val NumberKey = Color(0xFF20212B)
          private val Accent = Color(0xFFB8A4FF)
          private val White = Color(0xFFF5F3FC)
          private val Muted = Color(0xFF858493)

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.statusBarColor = android.graphics.Color.rgb(9, 10, 15)
                  window.navigationBarColor = android.graphics.Color.rgb(9, 10, 15)
                  setContent { KalcApp() }
              }
          }

          @Composable
          fun KalcApp() {
              var display by remember { mutableStateOf("0") }
              var stored by remember { mutableStateOf<Double?>(null) }
              var operator by remember { mutableStateOf("") }
              var fresh by remember { mutableStateOf(false) }
              var expression by remember { mutableStateOf("") }

              fun press(key: String) {
                  when (key) {
                      "AC" -> {
                          display = "0"
                          stored = null
                          operator = ""
                          expression = ""
                          fresh = false
                      }
                      "⌫" -> {
                          if (!fresh) display =
                              if (display.length > 1) display.dropLast(1) else "0"
                      }
                      "+", "−", "×", "÷" -> {
                          stored = display.toDoubleOrNull()
                          operator = key
                          expression = "$display $key"
                          fresh = true
                      }
                      "=" -> {
                          val a = stored
                          val b = display.toDoubleOrNull()
                          if (a != null && b != null) {
                              val result = when (operator) {
                                  "+" -> a + b
                                  "−" -> a - b
                                  "×" -> a * b
                                  "÷" -> if (b != 0.0) a / b else null
                                  else -> null
                              }
                              expression = "$a $operator $b"
                              display = result?.let { format(it) } ?: "Error"
                              stored = null
                              operator = ""
                              fresh = true
                          }
                      }
                      "%" -> display = format((display.toDoubleOrNull() ?: 0.0) / 100)
                      "±" -> display = format(-(display.toDoubleOrNull() ?: 0.0))
                      "." -> {
                          if (fresh) {
                              display = "0."
                              fresh = false
                          } else if (!display.contains(".")) display += "."
                      }
                      else -> {
                          if (fresh || display == "0" || display == "Error") {
                              display = key
                              fresh = false
                          } else if (display.length < 14) display += key
                      }
                  }
              }

              val rows = listOf(
                  listOf("AC", "±", "%", "÷"),
                  listOf("7", "8", "9", "×"),
                  listOf("4", "5", "6", "−"),
                  listOf("1", "2", "3", "+"),
                  listOf("⌫", "0", ".", "=")
              )

              MaterialTheme {
                  Column(
                      modifier = Modifier
                          .fillMaxSize()
                          .background(Background)
                          .padding(horizontal = 20.dp, vertical = 18.dp)
                  ) {
                      Row(
                          modifier = Modifier.fillMaxWidth(),
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          Column {
                              Text(
                                  "KALC",
                                  color = White,
                                  fontSize = 25.sp,
                                  fontWeight = FontWeight.Bold,
                                  letterSpacing = 5.sp
                              )
                              Text(
                                  "PRECISION, SIMPLIFIED",
                                  color = Muted,
                                  fontSize = 9.sp,
                                  letterSpacing = 2.sp
                              )
                          }
                          Spacer(Modifier.weight(1f))
                          Text("✦", color = Accent, fontSize = 26.sp)
                      }

                      Spacer(Modifier.weight(1f))

                      Text(
                          expression,
                          modifier = Modifier.fillMaxWidth(),
                          color = Muted,
                          fontSize = 18.sp,
                          textAlign = TextAlign.End
                      )
                      Spacer(Modifier.height(12.dp))
                      Text(
                          display,
                          modifier = Modifier.fillMaxWidth(),
                          color = White,
                          fontSize = if (display.length > 10) 42.sp else 58.sp,
                          fontWeight = FontWeight.Light,
                          textAlign = TextAlign.End,
                          maxLines = 1
                      )

                      Spacer(Modifier.height(30.dp))

                      rows.forEach { row ->
                          Row(
                              modifier = Modifier.fillMaxWidth(),
                              horizontalArrangement = Arrangement.spacedBy(10.dp)
                          ) {
                              row.forEach { key ->
                                  val isAccent = key == "="
                                  val isOperator = key in listOf("÷", "×", "−", "+")
                                  val isUtility = key in listOf("AC", "±", "%", "⌫")

                                  val bg = when {
                                      isAccent -> Accent
                                      isOperator -> Color(0xFF302A42)
                                      isUtility -> Panel
                                      else -> NumberKey
                                  }
                                  val fg = when {
                                      isAccent -> Background
                                      isOperator -> Accent
                                      isUtility -> Muted
                                      else -> White
                                  }

                                  Box(
                                      modifier = Modifier
                                          .weight(1f)
                                          .height(72.dp)
                                          .background(bg, RoundedCornerShape(24.dp))
                                          .clickable { press(key) },
                                      contentAlignment = Alignment.Center
                                  ) {
                                      Text(
                                          key,
                                          color = fg,
                                          fontSize = if (key.length > 1) 18.sp else 25.sp,
                                          fontWeight = if (isAccent) FontWeight.Bold
                                          else FontWeight.Medium
                                      )
                                  }
                              }
                          }
                          Spacer(Modifier.height(10.dp))
                      }

                      Spacer(Modifier.height(8.dp))
                      Text(
                          "MADE WITH PRECISION",
                          modifier = Modifier.fillMaxWidth(),
                          color = Color(0xFF555461),
                          fontSize = 9.sp,
                          letterSpacing = 2.sp,
                          textAlign = TextAlign.Center
                      )
                  }
              }
          }

          fun format(value: Double): String {
              if (!value.isFinite()) return "Error"
              return if (value == value.toLong().toDouble()) {
                  value.toLong().toString()
              } else {
                  String.format(Locale.US, "%.8f", value)
                      .trimEnd('0').trimEnd('.')
              }
          }
          EOF

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KALC-Premium-APK
          path: app/build/outputs/apk/debug/app-debug.apk
